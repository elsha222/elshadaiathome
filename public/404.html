<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ELIZA Healthcare</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Saves the full URL to sessionStorage then redirects to /
      // index.html reads it back and calls history.replaceState
      var pathSegmentsToKeep = 0; // 0 = custom domain; 1 = /repo-name/ subdirectory
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
